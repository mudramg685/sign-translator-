server:
  port: 8080

spring:
  application:
    name: isl-translator-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/isl_translator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:isl_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

isl-translator:
  ml-service-base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}
  confidence-threshold: ${ML_CONFIDENCE_THRESHOLD:0.70}
